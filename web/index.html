<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2257d6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="استوک لند" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
    <!-- فونت از خود سرور (همراه برنامه)؛ فونت گوگل در ایران فیلتر یا کند است و صفحه را تا ۱۰ ثانیه سفید نگه می‌داشت -->
    <style>
      html, body { margin: 0; background: #f6f7f9; }
      @media (prefers-color-scheme: dark) { html, body { background: #111317; } #boot { color: #9aa1ad; } }
      #boot { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
              font-family: Tahoma, sans-serif; color: #5f6673; font-size: 14px; }
      #boot i { width: 28px; height: 28px; border: 3px solid #2257d633; border-top-color: #2257d6; border-radius: 50%; animation: s .8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg) } }
    </style>
    <title>پنل استوک لند</title>
  </head>
  <body>
    <div id="root"><div id="boot"><i></i>پنل استوک لند</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
