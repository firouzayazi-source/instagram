# /etc/nginx/sites-available/ig.stland.ir  (گواهی با certbot)
server {
    listen 443 ssl http2;
    server_name ig.stland.ir;
    ssl_certificate     /etc/letsencrypt/live/ig.stland.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ig.stland.ir/privkey.pem;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 80;
    server_name ig.stland.ir;
    return 301 https://$host$request_uri;
}
