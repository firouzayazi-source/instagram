    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="استوک لند" />

    <!-- صفحه‌ی انتظار با لوگوی استوک لند: داخل همین فایل (بی هیچ درخواست اضافه)، تا برنامه بارگذاری شود -->
    <style>
      html { background: #0b0d12; }
      body { margin: 0; }
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 22px; background: radial-gradient(120% 80% at 50% 38%, #232833 0%, #12151b 55%, #0b0d12 100%);
                font-family: Tahoma, sans-serif; color: #c9ced8; transition: opacity .35s ease, transform .35s ease; }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .logo { width: 132px; height: auto; filter: drop-shadow(0 0 18px rgba(170, 190, 225, .25)); animation: float 3s ease-in-out infinite; }
      #splash .logo path { fill: url(#metal); stroke: #e8ecf4; stroke-width: 6; stroke-dasharray: 1; stroke-dashoffset: 1; fill-opacity: 0;
                           animation: draw .65s cubic-bezier(.6,.1,.3,1) forwards, fill .35s .45s ease forwards; }
      #splash .shine { transform-box: fill-box; transform: translateX(-120%); animation: shine 2.4s .7s ease-in-out infinite; }
      #splash .name { font-size: 15px; letter-spacing: .5px; opacity: 0; animation: up .4s .35s ease forwards; }
      #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; opacity: 0; animation: up .4s .5s ease forwards; }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, transparent, #7aa2ff, transparent); animation: run 1.1s ease-in-out infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fill { to { fill-opacity: 1; stroke-opacity: .15; } }
      @keyframes shine { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(220%); } }
      @keyframes float { 50% { transform: translateY(-4px); } }
      @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes run { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; } #splash .logo path { fill-opacity: 1; stroke-dashoffset: 0; } #splash .name, #splash .bar { opacity: 1; } }
    </style>
    <title>پنل استوک لند</title>
  </head>
